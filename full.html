<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ghazaleh Daily Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --pink: #ff7aa2;
      --blue: #6c8cff;
      --lavender: #f3f1ff;
      --soft-bg: #f5f7ff;
      --card-bg: #ffffff;
      --radius: 14px;
      --shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--soft-bg);
      margin: 0;
      padding: 12px;
      color: #222;
      line-height: 1.8;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    .tab-buttons {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding-bottom: 10px;
    }
    .tab-buttons::-webkit-scrollbar { display: none; }

    .tab-buttons button {
      white-space: nowrap;
      padding: 10px 14px;
      border-radius: var(--radius);
      border: none;
      background: var(--lavender);
      font-size: 0.85rem;
      cursor: pointer;
    }
    .tab-buttons button.active {
      background: var(--blue);
      color: #fff;
    }

    .tab-content {
      display: none;
      background: var(--card-bg);
      padding: 16px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-top: 10px;
    }
    .tab-content.active {
      display: block;
    }

    .card {
      background: #fff;
      padding: 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    label {
      font-size: 0.85rem;
      display: block;
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="file"],
    textarea,
    select {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: var(--lavender);
      font-size: 0.9rem;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (min-width: 600px) {
      .gallery {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .gallery-item {
      position: relative;
    }
    .gallery-item img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: var(--radius);
    }
    .delete-btn {
      position: absolute;
      bottom: 6px;
      right: 6px;
      padding: 4px 8px;
      font-size: 0.7rem;
      border: none;
      border-radius: 999px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Ghazaleh Planner</h1>

  <div class="tab-buttons">
    <button class="active" onclick="openTab(event, 'daily')">Daily</button>
    <button onclick="openTab(event, 'weekly')">Weekly</button>
    <button onclick="openTab(event, 'wishlist')">Wishlist</button>
  </div>

  <!-- DAILY TAB -->
  <div id="daily" class="tab-content active">
    <div class="card">
      <h2>Daily Focus</h2>
      <label for="daily_focus">Today's main focus</label>
      <input id="daily_focus" name="daily_focus" type="text" />

      <label for="daily_morning">Morning routine</label>
      <textarea id="daily_morning" name="daily_morning"></textarea>

      <label for="daily_evening">Evening reflection</label>
      <textarea id="daily_evening" name="daily_evening"></textarea>

      <label>
        <input id="daily_done" name="daily_done" type="checkbox" />
        Day completed
      </label>
    </div>
  </div>

  <!-- WEEKLY TAB -->
  <div id="weekly" class="tab-content">
    <div class="card">
      <h2>Weekly Goals</h2>
      <label for="weekly_goal">My goal for this week</label>
      <textarea id="weekly_goal" name="weekly_goal"></textarea>

      <label for="weekly_tasks">Key tasks</label>
      <textarea id="weekly_tasks" name="weekly_tasks"></textarea>
    </div>
  </div>

  <!-- WISHLIST TAB -->
  <div id="wishlist" class="tab-content">
    <div class="card">
      <h2>Wishlist Photos</h2>
      <label for="wishUpload">Upload wish photos</label>
      <input id="wishUpload" type="file" accept="image/*" multiple />

      <div id="gallery" class="gallery"></div>
    </div>
  </div>

  <script>
    /* ---------- Tabs ---------- */
    function openTab(evt, tabName) {
      const contents = document.querySelectorAll(".tab-content");
      const buttons = document.querySelectorAll(".tab-buttons button");

      contents.forEach(c => c.classList.remove("active"));
      buttons.forEach(b => b.classList.remove("active"));

      document.getElementById(tabName).classList.add("active");
      evt.target.classList.add("active");
    }

    /* ---------- Google Sheets Backend via GET ---------- */
    async function saveToSheet(tab, field, value) {
      try {
        const baseUrl = "https://script.google.com/macros/s/AKfycbwUTkcbP0fdXsnt5jkyle0MS-EMvh5FjGOw7Ir6dfkxaOM2suaVxRxwz0_CpZPeCSrHRQ/exec";
        const url = `${baseUrl}?tab=${encodeURIComponent(tab)}&field=${encodeURIComponent(field)}&value=${encodeURIComponent(value)}`;
        await fetch(url, { method: "GET" });
      } catch (e) {
        console.log("Save error:", e);
      }
    }

    /* ---------- Auto-save for all inputs ---------- */
    function setupAutoSave() {
      // text / textarea / select
      document.querySelectorAll("input[type=text], textarea, select").forEach(el => {
        const tab = el.closest(".tab-content")?.id || "general";
        const field = el.name || el.id || el.placeholder || "unknown";

        el.addEventListener("input", () => {
          saveToSheet(tab, field, el.value);

          if (tab === "daily" && el.id) {
            const today = new Date().toISOString().split("T")[0];
            localStorage.setItem(el.id, el.value + "||" + today);
          }
        });
      });

      // checkbox / radio
      document.querySelectorAll("input[type=checkbox], input[type=radio]").forEach(el => {
        const tab = el.closest(".tab-content")?.id || "general";
        const field = el.name || el.id;

        el.addEventListener("change", () => {
          const value = el.checked ? "true" : "false";
          saveToSheet(tab, field, value);

          if (tab === "daily" && el.id) {
            const today = new Date().toISOString().split("T")[0];
            localStorage.setItem(el.id, value + "||" + today);
          }
        });
      });
    }

    /* ---------- Restore Daily for today, clear older ---------- */
    function restoreTodayDaily() {
      const today = new Date().toISOString().split("T")[0];

      document.querySelectorAll("#daily input, #daily textarea, #daily select").forEach(el => {
        if (!el.id) return;

        const saved = localStorage.getItem(el.id);
        if (!saved) {
          if (el.type === "checkbox" || el.type === "radio") {
            el.checked = false;
          } else {
            el.value = "";
          }
          return;
        }

        const [value, date] = saved.split("||");

        if (date === today) {
          if (el.type === "checkbox" || el.type === "radio") {
            el.checked = (value === "true");
          } else {
            el.value = value;
          }
        } else {
          if (el.type === "checkbox" || el.type === "radio") {
            el.checked = false;
          } else {
            el.value = "";
          }
        }
      });
    }

    /* ---------- GitHub Upload for Wishlist Photos ---------- */
    const GITHUB_TOKEN = "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";  // ← replace
    const GITHUB_REPO  = "ghazalehkeyvani/planner";
    const GITHUB_PATH  = "wishes";

    async function uploadWishToGitHub(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = async function () {
          const base64 = reader.result.split(",")[1];
          const filePath = `${GITHUB_PATH}/${Date.now()}_${file.name}`;

          const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${filePath}`, {
            method: "PUT",
            headers: {
              "Authorization": `Bearer ${GITHUB_TOKEN}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: "Add wish photo",
              content: base64
            })
          });

          const result = await response.json();

          if (result?.content?.download_url) {
            resolve(result.content.download_url);
          } else {
            reject("Upload failed");
          }
        };

        reader.readAsDataURL(file);
      });
    }

    const uploadInput = document.getElementById("wishUpload");
    const gallery = document.getElementById("gallery");

    uploadInput.addEventListener("change", async function () {
      const files = Array.from(this.files);

      for (const file of files) {
        try {
          const url = await uploadWishToGitHub(file);

          const item = document.createElement("div");
          item.className = "gallery-item";

          item.innerHTML = `
            <img src="${url}" alt="wish photo">
            <button class="delete-btn" onclick="this.parentElement.remove()">حذف</button>
          `;

          gallery.appendChild(item);

          // log in sheet
          saveToSheet("wishlist", "image_url", url);

        } catch (err) {
          console.log("Upload error:", err);
        }
      }

      this.value = "";
    });

    /* ---------- Init ---------- */
    window.addEventListener("load", () => {
      setupAutoSave();
      restoreTodayDaily();
    });
  </script>
</body>
</html>
